[package]
name = "studio-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Operate Studio LSP, the Fiber liquidity service that opens channels for Fiber Studio."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
clap-serde-derive = "0.2.1"
fiber-json-types = { path = "../fiber/crates/fiber-json-types" }
fnn = { path = "../fiber/crates/fiber-lib", features = ["bench", "sqlite"] }
hex = "0.4"
ractor = "0.15"
secp256k1 = { version = "0.30.0", features = ["recovery", "global-context"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
