[package]
name = "studio-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Operate Studio LSP, the Fiber liquidity service that opens channels for Fiber Studio."

[dependencies]
bs58 = "0.5"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
secp256k1 = { version = "0.30.0", features = ["recovery", "global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tentacle-multiaddr = "0.3.8"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
clap-serde-derive = "0.2.1"
fiber-json-types = { git = "https://github.com/chukwuma619/fiber.git", branch = "feat/jit-channel" }
fnn = { git = "https://github.com/chukwuma619/fiber.git", branch = "feat/jit-channel", features = ["bench", "sqlite"] }
ractor = "0.15"
serde_yaml = "0.9"
tentacle-secio = "0.6.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
